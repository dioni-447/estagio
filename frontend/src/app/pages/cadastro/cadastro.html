<div class="cadastro-container">

    <h2>Criar Conta</h2>

    <form (ngSubmit)="register()">

        <input
            type="text"
            placeholder="Nome"
            [(ngModel)]="name"
            name="name"
            required
        >

        <input
            type="email"
            placeholder="E-mail"
            [(ngModel)]="email"
            name="email"
            required
        >

        <input
            type="password"
            placeholder="Senha"
            [(ngModel)]="password"
            name="password"
            required
        >

        <input
            type="password"
            placeholder="Confirmar Senha"
            [(ngModel)]="passwordConfirmation"
            name="passwordConfirmation"
            required
        >

        <button type="submit">

            Criar conta

        </button>

    </form>

</div>
